# Los van de push-workflow, zodat GitHub bij 60 dagen inactiviteit alleen
# deze geplande run uitzet en pushes naar main blijven publiceren.

name: Refresh LandEigenaar aanbod

on:
  workflow_dispatch:
  schedule:
    # Twee keer per dag (05:00 en 17:00 UTC) zodat het aanbod actueel blijft
    - cron: "0 5,17 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
